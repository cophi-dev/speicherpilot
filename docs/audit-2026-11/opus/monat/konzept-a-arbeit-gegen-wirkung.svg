<text x="144" y="962" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#9aa3ac" text-anchor="start" letter-spacing="0">Jeder Punkt ist ein ganzer Monatslauf (2.980 Viertelstunden): waagrecht die Ladung aus dem Netz, senkrecht die Wirkung auf die höchste Restlast.</text><text x="144" y="980" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#9aa3ac" text-anchor="start" letter-spacing="0">Modell: Round-Trip 85 %, SoC 10–90 %, Preisnehmer, nur Day-Ahead, perfekte Voraussicht. Ohne Preisrückwirkung: bei ×5/×10 würden Preise sich anpassen.</text><text x="144" y="998" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#9aa3ac" text-anchor="start" letter-spacing="0">Kein Euro. Quelle: Energy-Charts, Bundesnetzagentur | SMARD.de (CC BY 4.0).</text>
