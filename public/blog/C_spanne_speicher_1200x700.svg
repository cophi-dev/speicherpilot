=".05"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#14181C" stroke-opacity=".05"/><line x1="0" y1="560" x2="1200" y2="560" stroke="#14181C" stroke-opacity=".05"/><line x1="0" y1="640" x2="1200" y2="640" stroke="#14181C" stroke-opacity=".05"/><rect x="56" y="34" width="82" height="26" rx="13" fill="#14181C"/><text class="m" x="97" y="52" fill="#F4F3EE" font-size="13" text-anchor="middle" letter-spacing="1.6" font-weight="500">MODELL</text><text class="m" x="152" y="52" fill="#14181C" font-size="14" letter-spacing=".4">Wenn-dann-Rechnung, keine Prognose</text><text class="l" x="55" y="118" fill="#14181C" font-size="46" letter-spacing="-1">Je mehr Speicher, desto kleiner die Spanne</text><text class="m" x="56" y="176" fill="#4F5961" font-size="14" letter-spacing=".4">mittlere Tagesspanne in €/MWh</text><line x1="80" y1="536" x2="720" y2="536" stroke="#14181C" stroke-width="2"/><line x1="241.5" y1="196" x2="241.5" y2="536" stroke="#14181C" stroke-width="1.5" stroke-dasharray="5 5"/><text class="m" x="251.5" y="206" fill="#14181C" font-size="14" >heutiger Bestand Großspeicher ca. 4,5 GW</text><text class="m" x="251.5" y="226" fill="#4F5961" font-size="14" >(MaStR, 13.10.2026)</text><line x1="120" y1="536" x2="120" y2="263.0" stroke="#14181C" stroke-width="2.5"/><circle cx="120" cy="263.0" r="10" fill="#14181C" stroke="#F4F3EE" stroke-width="3"/><text class="l" x="142" y="277.0" fill="#14181C" font-size="46" letter-spacing="-1">130</text><line x1="255" y1="536" x2="255" y2="372.2" stroke="#0B6870" stroke-width="2.5"/><circle cx="255" cy="372.2" r="10" fill="#0B6870" stroke="#F4F3EE" stroke-width="3"/><text class="l" x="277" y="386.2" fill="#14181C" font-size="46" letter-spacing="-1">78</text><line x1="660" y1="536" x2="660" y2="424.7" stroke="#0B6870" stroke-width="2.5"/><circle cx="660" cy="424.7" r="10" fill="#0B6870" stroke="#F4F3EE" stroke-width="3"/><text class="l" x="682" y="438.7" fill="#14181C" font-size="46" letter-spacing="-1">53</text><text class="m" x="682" y="464.7" fill="#4F5961" font-size="15" >(−60 %)</text><text class="m" x="120" y="564" fill="#14181C" font-size="16" text-anchor="middle" font-weight="500">0 GW</text><text class="m" x="120" y="584" fill="#4F5961" font-size="13" text-anchor="middle">reale Gebote 2025</text><text class="m" x="255" y="564" fill="#14181C" font-size="16" text-anchor="middle" font-weight="500">5 GW</text><text class="m" x="255" y="584" fill="#4F5961" font-size="13" text-anchor="middle">Szenario</text><text class="m" x="660" y="564" fill="#14181C" font-size="16" text-anchor="middle" font-weight="500">20 GW</text><text class="m" x="660" y="584" fill="#4F5961" font-size="13" text-anchor="middle">Szenario (2 h, 40 GWh)</text><text class="m" x="80" y="616" fill="#4F5961" font-size="14" letter-spacing=".3">zusätzliche Batterieleistung (2 Stunden Speicherdauer)</text><text class="m" x="790" y="176" fill="#4F5961" font-size="14" letter-spacing=".3">Ohne zusätzliche Speicher → bei 20 GW, 2 h</text><line x1="790" y1="206" x2="1144" y2="206" stroke="#14181C" stroke-opacity=".3"/><text class="m" x="790" y="232" fill="#14181C" font-size="14" letter-spacing=".2">Stunden über 200 €/MWh</text><text class="l" x="789" y="284" fill="#14181C" font-size="46" letter-spacing="-1">169 → 20</text><line x1="790" y1="310" x2="1144" y2="310" stroke="#14181C" stroke-opacity=".3"/><text class="m" x="790" y="336" fill="#14181C" font-size="14" letter-spacing=".2">Negative Preisstunden</text><text class="l" x="789" y="388" fill="#14181C" font-size="46" letter-spacing="-1">575 → 271</text><line x1="790" y1="414" x2="1144" y2="414" stroke="#14181C" stroke-opacity=".3"/><text class="m" x="790" y="440" fill="#14181C" font-size="14" letter-spacing=".2">Marktwert Solar in €/MWh (+35 %)</text><text class="l" x="789" y="492" fill="#14181C" font-size="46" letter-spacing="-1">45,08 → 61,02</text><line x1="790" y1="518" x2="1144" y2="518" stroke="#14181C" stroke-opacity=".3"/><text class="m" x="790" y="544" fill="#14181C" font-size="14" letter-spacing=".2">Day-Ahead-Erlös je kW und Jahr</text><text class="l" x="789" y="580" fill="#14181C" font-size="30" letter-spacing="-.5">35 € → 11 €</text><text class="m" x="790" y="602" fill="#4F5961" font-size="13" >bei 2 GW → bei 20 GW</text><text class="m" x="790" y="620" fill="#4F5961" font-size="13" >Modellschätzung, nur Day-Ahead, 2 h</text><line x1="56" y1="640" x2="1144" y2="640" stroke="#14181C" stroke-opacity=".15"/><text class="m" x="56" y="662" fill="#4F5961" font-size="13" >Quelle: Fraunhofer ISE / Energy-Charts, Preissimulator (Pressemitteilung 01.10.2026; Vortrag 20.10.2026), reale Day-Ahead-Gebote 2025,</text><text class="m" x="56" y="682" fill="#4F5961" font-size="13" >nur Day-Ahead-Markt. Bestand: Marktstammdatenregister, Stand 13.10.2026.</text></svg>