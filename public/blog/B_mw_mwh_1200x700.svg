<pattern id="hat2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#14181C" stroke-opacity=".4" stroke-width="1"/></pattern></defs><text class="m" x="56" y="60" fill="#4F5961" font-size="14" letter-spacing=".6">Beispiel: Großspeicher 100 MW / 230 MWh (Modellanker)</text><line x1="56" y1="34" x2="106" y2="34" stroke="#14181C" stroke-opacity=".5"/><text class="l" x="55" y="116" fill="#14181C" font-size="46" letter-spacing="-1">MW ist der Hahn, MWh ist der Tank</text><rect x="420" y="190" width="320" height="220" rx="16" fill="#7DFCE6" stroke="#14181C" stroke-width="2"/><line x1="714" y1="245.0" x2="740" y2="245.0" stroke="#14181C" stroke-opacity=".45"/><line x1="714" y1="300.0" x2="740" y2="300.0" stroke="#14181C" stroke-opacity=".45"/><line x1="714" y1="355.0" x2="740" y2="355.0" stroke="#14181C" stroke-opacity=".45"/><text class="m" x="448" y="234" fill="#14181C" font-size="14" letter-spacing="2">KAPAZITÄT</text><text class="l" x="446" y="300" fill="#14181C" font-size="52" letter-spacing="-1">238 MWh</text><text class="m" x="448" y="336" fill="#14181C" font-size="15" >wie viel Energie hineinpasst</text><text class="m" x="448" y="368" fill="#14181C" font-size="14" letter-spacing=".6">voll geladen</text><line x1="56" y1="302.0" x2="420" y2="302.0" stroke="#14181C" stroke-width="2"/><line x1="56" y1="362.0" x2="420" y2="362.0" stroke="#14181C" stroke-width="2"/><rect x="56" y="302.0" width="364" height="60" fill="#14181C" fill-opacity=".04"/><line x1="76" y1="332" x2="168" y2="332" stroke="#14181C" stroke-width="2"/><path d="M168 323L186 332L168 341" fill="none" stroke="#14181C" stroke-width="2"/><path d="M313 310L335 332L313 354Z M357 310L335 332L357 354Z" fill="#F4F3EE" stroke="#14181C" stroke-width="2" stroke-linejoin="round"/><line x1="335" y1="332" x2="335" y2="274" stroke="#14181C" stroke-width="2"/><line x1="317" y1="274" x2="353" y2="274" stroke="#14181C" stroke-width="3" stroke-linecap="round"/><text class="m" x="56" y="196" fill="#14181C" font-size="14" letter-spacing="2">LEISTUNG</text><text class="l" x="55" y="246" fill="#14181C" font-size="52" letter-spacing="-1">103,5 MW</text><text class="m" x="56" y="276" fill="#4F5961" font-size="15" >wie schnell Energie fließt</text><text class="m" x="56" y="396.0" fill="#4F5961" font-size="15" >Breite des Anschlusses</text><text class="m" x="56" y="456" fill="#4F5961" font-size="14" letter-spacing=".6">Entladen bei voller Leistung</text><path d="M56 470L740 524L56 524Z" fill="#7DFCE6" stroke="#14181C" stroke-width="2" stroke-linejoin="round"/><line x1="56" y1="524" x2="740" y2="524" stroke="#14181C" stroke-width="2"/><line x1="353.3913043478261" y1="464" x2="353.3913043478261" y2="534" stroke="#14181C" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="56" y1="524" x2="56" y2="532" stroke="#14181C" stroke-width="2"/><line x1="353.3913043478261" y1="524" x2="353.3913043478261" y2="532" stroke="#14181C" stroke-width="2"/><line x1="740" y1="524" x2="740" y2="532" stroke="#14181C" stroke-width="2"/><text class="m" x="56" y="552" fill="#14181C" font-size="14" >0 h</text><text class="m" x="353.3913043478261" y="552" fill="#14181C" font-size="14" text-anchor="middle">1 h</text><text class="m" x="740" y="552" fill="#14181C" font-size="14" text-anchor="end">2,3 h</text><text class="m" x="363.3913043478261" y="474" fill="#14181C" font-size="14" >1 C = Vollentladung in 1 Stunde</text><text class="l" x="55" y="615" fill="#14181C" font-size="32" letter-spacing="-.4">238 MWh ÷ 103,5 MW = 2,3 h</text><text class="" x="56" y="644" fill="#14181C" font-size="17" font-weight="500">≈ 2,3 Stunden bei voller Leistung</text><text class="l" x="520" y="615" fill="#0B6870" font-size="32" letter-spacing="-.4">≈ 0,43 C</text><text class="m" x="522" y="644" fill="#4F5961" font-size="15" >Leistung ÷ Kapazität</text><rect x="790" y="150" width="354" height="470" rx="16" fill="#FFFFFF" fill-opacity=".55" stroke="#14181C" stroke-opacity=".3" stroke-dasharray="5 5"/><rect x="812" y="172" width="82" height="26" rx="13" fill="#14181C"/><text class="m" x="853" y="190" fill="#F4F3EE" font-size="13" text-anchor="middle" letter-spacing="1.6" font-weight="500">MODELL</text><text class="m" x="906" y="190" fill="#14181C" font-size="14" letter-spacing=".4">Modellannahme</text><text class="" x="812" y="234" fill="#14181C" font-size="18" >Round-Trip 85 % (Spanne</text><text class="" x="812" y="258" fill="#14181C" font-size="18" >80 bis 90 %): aus 100 MWh</text><text class="" x="812" y="282" fill="#14181C" font-size="18" >Ladung werden rund 85 MWh</text><text class="" x="812" y="306" fill="#14181C" font-size="18" >Entladung</text><line x1="812" y1="518" x2="1122" y2="518" stroke="#14181C" stroke-width="2"/><rect x="832" y="358" width="84" height="160" fill="#7DFCE6" stroke="#14181C" stroke-width="2"/><rect x="962" y="358" width="84" height="24.0" fill="none" stroke="#14181C" stroke-opacity=".6" stroke-dasharray="4 4"/><rect x="962" y="382.0" width="84" height="136.0" fill="url(#hat)" stroke="#14181C" stroke-width="2"/><path d="M1055 374.0L1060 374.0L1060 390.0L1055 390.0" fill="none" stroke="#14181C" stroke-width="1.5"/><text class="m" x="1068" y="387.0" fill="#14181C" font-size="13" >Spanne</text><text class="m" x="1004.0" y="348" fill="#4F5961" font-size="13" text-anchor="middle">Verluste</text><text class="m" x="874.0" y="542" fill="#14181C" font-size="15" text-anchor="middle" font-weight="500">100 MWh</text><text class="m" x="874.0" y="560" fill="#4F5961" font-size="14" text-anchor="middle">geladen</text><text class="m" x="1004.0" y="542" fill="#14181C" font-size="15" text-anchor="middle" font-weight="500">rund 85 MWh</text><text class="m" x="1004.0" y="560" fill="#4F5961" font-size="14" text-anchor="middle">entladen</text><text class="m" x="812" y="598" fill="#4F5961" font-size="13" >Kein Messwert am Modellanker</text><line x1="56" y1="670" x2="1144" y2="670" stroke="#14181C" stroke-opacity=".15"/><text class="m" x="56" y="690" fill="#4F5961" font-size="13" >Quellen: Register (Projektseite, Pressemitteilung 05.06.2025), Modellannahme SpeicherPilot; Rechnung eigene. Stand 27.10.2026</text></svg>